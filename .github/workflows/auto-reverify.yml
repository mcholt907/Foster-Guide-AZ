name: Auto Re-verify Content

# SAFETY: this workflow must never push to the default branch (it auto-deploys
# to production). All changes go to the `auto-reverify` branch and a pull
# request that a person reviews and merges. No auto-merge, no [skip ci].
#
# Repo requirements:
#   - Settings → Actions → General → "Allow GitHub Actions to create and
#     approve pull requests" must be enabled, or the PR step fails.
#   - PRs opened with the default GITHUB_TOKEN do NOT trigger other workflows
#     (content-validation, link-check). To have them run automatically, add a
#     fine-grained PAT (contents + pull requests: write) as the secret
#     AUTO_REVERIFY_TOKEN. Without it, a reviewer must close and reopen the PR
#     to start the checks; this workflow also runs content validation itself
#     and puts the result in the PR body.

on:
  schedule:
    - cron: "0 7 * * 1" # Every Monday at 7:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — report only, don't update files or open a PR"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: auto-reverify
  cancel-in-progress: false

env:
  PR_BRANCH: auto-reverify
  BASE_BRANCH: ${{ github.event.repository.default_branch }}
  DRY_RUN: ${{ inputs.dry_run || 'false' }}

jobs:
  reverify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTO_REVERIFY_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tsx
        run: npm install -g tsx

      # ── Step 1: Run reverification ──────────────────────────────────────
      # The script never writes a phone number, and only bumps lastVerified
      # for entries it positively confirmed. Exit 0 = all confirmed,
      # 1 = some entries need a person, 2+ = the script crashed.

      - name: Re-verify stale content
        id: reverify
        shell: bash
        run: |
          set +e
          echo "TODAY=$(date -u +%F)" >> "$GITHUB_ENV"
          if [[ "$DRY_RUN" == "true" ]]; then
            npx tsx scripts/reverify-content.ts 2>&1 | tee /tmp/reverify-output.txt
          else
            npx tsx scripts/reverify-content.ts --apply 2>&1 | tee /tmp/reverify-output.txt
          fi
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" -ge 2 ]]; then
            echo "::error::reverify-content.ts crashed (exit $code)"
            exit "$code"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reverification-report
          path: |
            docs/reverification-report.md
            /tmp/reverify-output.txt
          if-no-files-found: ignore

      # ── Step 2: Open (or update) a pull request — never push to master ──

      - name: Open or update pull request
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTO_REVERIFY_TOKEN || github.token }}
        run: |
          set -euo pipefail

          # Only the files the script is allowed to change. Never `git add -A`.
          DATA_FILES=(web/src/data/resources.ts web/src/data/constants.ts web/src/data/docs.ts)
          git add -- "${DATA_FILES[@]}"

          if git diff --staged --quiet; then
            echo "No data file changes — no pull request needed."
            git status --short
            exit 0
          fi

          # Data changed: refresh the reports so they ship in the same PR.
          npx tsx scripts/generate-freshness-report.ts || echo "::warning::freshness report generation failed"
          for f in docs/reverification-report.md docs/freshness-report.md; do
            if [[ -f "$f" ]]; then git add -- "$f"; fi
          done

          VALIDATION="passed"
          if ! npx tsx scripts/validate-content.ts > /tmp/validate-output.txt 2>&1; then
            VALIDATION="FAILED — see the workflow run log before merging"
            cat /tmp/validate-output.txt
          fi

          echo "Files in this pull request:"
          git diff --staged --name-only

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout -B "$PR_BRANCH"
          git commit -m "chore: auto-reverify content ($TODAY)" \
            -m "Automated check by scripts/reverify-content.ts. Needs human review before merge. Phone numbers are never changed by automation; lastVerified is bumped only for entries the script positively confirmed. Report: docs/reverification-report.md"
          git push --force origin "$PR_BRANCH"

          {
            echo "Automated weekly re-check of stale content. **A person must review this before merging — merging deploys to production.**"
            echo
            echo "- No phone number is ever changed by this automation. Possible phone changes are listed below for you to check by hand."
            echo "- \`lastVerified\` is updated only where the stored number was found on the entry's page (or the entry has no number and its link loaded without a redirect). Nobody called any number."
            echo "- Any URL change is a permanent same-site redirect and is listed below. Please open each new link once."
            echo "- Content validation run by this workflow: **$VALIDATION**."
            echo "- If the PR checks (content-validation, link-check) did not start, close and reopen this PR to trigger them."
            echo
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "---"
            echo
            if [[ -f docs/reverification-report.md ]]; then
              head -c 55000 docs/reverification-report.md
            else
              echo "(No report file was generated — see the workflow run log.)"
            fi
          } > /tmp/pr-body.md

          TITLE="chore: auto-reverify content — review needed ($TODAY)"
          PR_NUMBER=$(gh pr list --head "$PR_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$PR_NUMBER" ]]; then
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body-file /tmp/pr-body.md
            echo "Updated pull request #$PR_NUMBER"
          else
            gh pr create --base "$BASE_BRANCH" --head "$PR_BRANCH" --title "$TITLE" --body-file /tmp/pr-body.md
          fi

      # ── Step 3: Issue for entries that need a person ────────────────────

      - name: Build issue body
        if: steps.reverify.outputs.exit_code == '1'
        shell: bash
        run: |
          {
            echo "## Content re-verification — manual review required"
            echo
            echo "The automated check could not confirm some entries. Nothing was changed for them: phone numbers are never auto-corrected, and their \`lastVerified\` dates were left alone."
            echo
            echo "### How to resolve"
            echo "1. For each entry below, check the organization's website or call the number."
            echo "2. Fix the entry in \`web/src/data/\` if needed."
            echo "3. Set \`lastVerified\` to today's date and open a pull request."
            echo
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "---"
            echo
            if [[ -f docs/reverification-report.md ]]; then
              head -c 55000 docs/reverification-report.md
            else
              echo '```'
              tail -60 /tmp/reverify-output.txt
              echo '```'
            fi
          } > /tmp/issue-body.md

      - name: Find existing open issue
        id: existing_issue
        if: steps.reverify.outputs.exit_code == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --label reverify-failed --state open --json number --jq '.[0].number // empty' || true)
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Update existing issue
        if: steps.reverify.outputs.exit_code == '1' && steps.existing_issue.outputs.number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.existing_issue.outputs.number }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-body.md

      - name: Post new issue
        if: steps.reverify.outputs.exit_code == '1' && steps.existing_issue.outputs.number == ''
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Content re-verification — manual review needed (${{ env.TODAY }})"
          content-filepath: /tmp/issue-body.md
          labels: |
            content-freshness
            reverify-failed
            manual-review
            auto-detected
