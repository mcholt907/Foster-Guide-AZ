name: Link Check

# Checks every url in the live site's data (web/src/data). The retired
# server/ data is not scanned.
#
# On the weekly and manual runs a failure updates ONE open issue (label
# `broken-links`) instead of opening a new one each time. Pull request runs
# only pass or fail the check; they never touch issues.

on:
  schedule:
    - cron: "0 6 * * 0" # Every Sunday at 6:00 UTC
  workflow_dispatch: # Manual trigger
  pull_request:
    paths:
      - "web/src/data/*.ts"
      - ".github/workflows/link-check.yml"

permissions:
  issues: write
  contents: read

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

env:
  # Arizona state sites that answer automated checkers with "403 Forbidden"
  # even though the pages work in a browser. For these hosts ONLY, 403 counts
  # as "the page is there". Every other site must answer 200. A 404 or a dead
  # domain still fails for these hosts. The weekly auto-reverify workflow
  # (scripts/reverify-content.ts) also checks these entries.
  # One host per line, as a regex fragment; sub-domains (www.) are included.
  BOT_BLOCKED_HOSTS: |
    dcs\.az\.gov
    des\.az\.gov
    azdot\.gov
    arizonaatwork\.com

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract URLs from data files
        shell: bash
        run: |
          set -euo pipefail
          grep -rhoP '(?:url|website):\s*"(https?://[^"]+)"' web/src/data/*.ts \
            | sed 's/.*"\(http[^"]*\)".*/\1/' \
            | sort -u > /tmp/urls-all.txt

          HOSTS=$(echo "$BOT_BLOCKED_HOSTS" | sed '/^\s*$/d' | paste -sd'|')
          PATTERN="^https?://([a-z0-9-]+\.)*(${HOSTS})(/|$)"
          grep -Ei "$PATTERN" /tmp/urls-all.txt > /tmp/urls-bot-blocked.txt || true
          grep -Eiv "$PATTERN" /tmp/urls-all.txt > /tmp/urls.txt || true

          echo "Found $(wc -l < /tmp/urls-all.txt) unique URLs"
          echo "--- normal check ($(wc -l < /tmp/urls.txt)) ---"
          cat /tmp/urls.txt
          echo "--- state sites where 403 is accepted ($(wc -l < /tmp/urls-bot-blocked.txt)) ---"
          cat /tmp/urls-bot-blocked.txt

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --timeout 20
            --max-concurrency 5
            --max-retries 3
            --accept 200
            --exclude "^tel:|^sms:|^mailto:|^https://www.ssa.gov"
            --user-agent "Mozilla/5.0 (compatible; FosterHubAZ-LinkChecker/1.0)"
            /tmp/urls.txt
          output: /tmp/lychee-main.md
          fail: false
          failIfEmpty: false

      - name: Check links on state sites that block bots (403 accepted)
        id: lychee_gov
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --timeout 20
            --max-concurrency 2
            --max-retries 3
            --accept 200,403
            --user-agent "Mozilla/5.0 (compatible; FosterHubAZ-LinkChecker/1.0)"
            /tmp/urls-bot-blocked.txt
          output: /tmp/lychee-gov.md
          fail: false
          failIfEmpty: false

      - name: Build report
        id: report
        shell: bash
        env:
          MAIN_EXIT: ${{ steps.lychee.outputs.exit_code }}
          GOV_EXIT: ${{ steps.lychee_gov.outputs.exit_code }}
        run: |
          {
            echo "## Broken links in resource data"
            echo
            echo "Checked on $(date -u +%F). Fix the entry in \`web/src/data/\`, set its \`lastVerified\` to today, and open a pull request. This issue is updated by each weekly run; close it once the check passes."
            echo
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "### All sites except the state sites below"
            echo
            if [[ -f /tmp/lychee-main.md ]]; then cat /tmp/lychee-main.md; else echo "(no report)"; fi
            echo
            echo "### Arizona state sites that block bots (403 accepted here only)"
            echo
            if [[ -f /tmp/lychee-gov.md ]]; then cat /tmp/lychee-gov.md; else echo "(no report)"; fi
          } > /tmp/link-report.md
          head -c 60000 /tmp/link-report.md > /tmp/issue-body.md

          if [[ "${MAIN_EXIT:-1}" == "0" && "${GOV_EXIT:-1}" == "0" ]]; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      # One issue, updated in place. Never on pull requests.
      - name: Update the open broken-links issue (or open one)
        if: steps.report.outputs.failed == 'true' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --label broken-links --state open \
            --json number --jq 'sort_by(.number) | .[0].number // empty')
          if [[ -n "$NUMBER" ]]; then
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-body.md
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "Still failing on $(date -u +%F). The issue text above has the current list. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Updated issue #$NUMBER"
          else
            for label in content-freshness broken-links auto-detected; do
              gh label create "$label" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            done
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Broken links found in resource data" \
              --body-file /tmp/issue-body.md \
              --label content-freshness --label broken-links --label auto-detected
          fi

      - name: Fail if any link is broken
        if: steps.report.outputs.failed == 'true'
        run: |
          echo "::error::Broken links found. See the job summary."
          exit 1
